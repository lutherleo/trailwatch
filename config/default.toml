# trailwatch configuration (generated by `trailwatch config`).

[ingest]
max_lateness_seconds = 900.0
max_buffer = 200000

[baseline]
half_life_days = 30.0
warmup_days = 7.0
warmup_events = 50
familiar_min_weight = 3.0
suppress_familiar = true
max_principals = 50000
max_apis = 512
max_regions = 32
max_ua_families = 16
max_asns = 64
max_countries = 32

[travel]
enabled = true
max_speed_kmh = 1000.0
min_distance_km = 500.0
severity = "high"

[console_mfa]
enabled = true
window_minutes = 120.0
login_severity = "low"
change_severity = "critical"

[access_keys]
enabled = true
routine_min_weight = 1.5

[enumeration]
enabled = true
window_minutes = 10.0
min_distinct_apis = 20
min_services = 4
min_denied = 12
peak_margin = 1.25
max_window_items = 2000

[logging_tamper]
enabled = true
allowlist_trail_prefixes = []

[novelty]
enabled = true
region_severity = "low"
ua_family_severity = "medium"
asn_severity = "low"
country_severity = "medium"
rare_api_severity = "low"
sensitive_api_severity = "medium"
global_rare_share = 0.002
sensitive_apis = ["secretsmanager:GetSecretValue", "ssm:GetParameters", "ssm:GetParameter", "kms:Decrypt", "iam:CreateAccessKey", "iam:CreateLoginProfile", "iam:UpdateLoginProfile", "iam:AttachUserPolicy", "iam:PutUserPolicy", "iam:AttachRolePolicy", "iam:UpdateAssumeRolePolicy", "sts:GetFederationToken", "s3:PutBucketPolicy", "s3:PutBucketAcl", "ec2:ModifySnapshotAttribute", "ec2:CreateKeyPair", "ec2:ImportKeyPair"]

[scoring]
half_life_hours = 6.0
threshold = 60.0
weight_info = 0.0
weight_low = 10.0
weight_medium = 25.0
weight_high = 50.0
weight_critical = 80.0
max_contributions = 32
direct_alert_severity = "high"

[dedup]
ttl_hours = 12.0
max_entries = 100000
max_evidence = 50

[state]
max_rule_principals = 50000
